<!DOCTYPE html>
<html lang="ky">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Лагердеги видеолор — Ozgor Kamp</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f2;
      color: #173d2a;
    }

    header {
      background: #173d2a;
      color: white;
      padding: 22px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    header a {
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.4);
      padding: 10px 18px;
      border-radius: 25px;
    }

    .title {
      text-align: center;
      padding: 70px 20px 45px;
    }

    .title h1 {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .title p {
      color: #707970;
    }

    .videos {
      width: 92%;
      max-width: 1100px;
      margin: auto;
      padding-bottom: 90px;

      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }

    .video-card {
      background: white;
      padding: 15px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0,0,0,.06);
    }

    video {
      width: 100%;
      display: block;
      border-radius: 15px;
    }

    .video-card h3 {
      padding: 15px 5px 5px;
    }

    footer {
      background: #10281d;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .phone {
      display: inline-block;
      color: white;
      margin-top: 10px;
      font-weight: bold;
      font-size: 19px;
    }

    @media(max-width: 700px) {

      .videos {
        grid-template-columns: 1fr;
      }

      .title h1 {
        font-size: 34px;
      }

    }

  </style>

</head>
