<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Лагердеги сүрөттөр — Ozgor Kamp</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f6f2;
      color: #173d2a;
    }

    header {
      background: #173d2a;
      color: white;
      padding: 22px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
    }

    header a {
      color: white;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.4);
      padding: 10px 18px;
      border-radius: 25px;
    }

    .title {
      text-align: center;
      padding: 70px 20px 45px;
    }

    .title h1 {
      font-size: 45px;
      margin-bottom: 10px;
    }

    .title p {
      color: #707970;
    }

    .gallery {
      width: 92%;
      max-width: 1200px;
      margin: auto;
      padding-bottom: 90px;

      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .photo {
      height: 320px;
      overflow: hidden;
      border-radius: 20px;
      background: white;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .4s;
    }

    .photo:hover img {
      transform: scale(1.05);
    }

    footer {
      background: #10281d;
      color: white;
      text-align: center;
      padding: 40px;
    }

    .phone {
      display: inline-block;
      color: white;
      margin-top: 10px;
      font-weight: bold;
      font-size: 19px;
    }

    @media(max-width: 800px) {

      .gallery {
        grid-template-columns: repeat(2, 1fr);
      }

    }

    @media(max-width: 500px) {

      .gallery {
        grid-template-columns: 1fr;
      }

      .title h1 {
        font-size: 34px;
      }

      .photo {
        height: 280px;
      }

    }

  </style>
</head>

<body>

<header>

  <div class="logo">
    OZGОR KAMP
  </div>

  <a href="index.html">
    Башкы бет
  </a>

</header>


<div class="title">

  <h1>
    Лагердеги сүрөттөр
  </h1>

  <p>
    Ozgor Kamp лагеринен көз ирмемдер
  </p>

</div>


<div class="gallery">

  <!-- Бул жерге өзүңдүн сүрөттөрүңдү кошосуң -->

  <div class="photo">
    <img src="images/СҮРӨТТҮН_АТЫ.jpg" alt="Ozgor Kamp">
  </div>

  <div class="photo">
    <img src="images/СҮРӨТТҮН_АТЫ.jpg" alt="Ozgor Kamp">
  </div>

  <div class="photo">
    <img src="images/СҮРӨТТҮН_АТЫ.jpg" alt="Ozgor Kamp">
  </div>

  <div class="photo">
    <img src="images/СҮРӨТТҮН_АТЫ.jpg" alt="Ozgor Kamp">
  </div>

  <div class="photo">
    <img src="images/СҮРӨТТҮН_АТЫ.jpg" alt="Ozgor Kamp">
  </div>

  <div class="photo">
    <img src="images/СҮРӨТТҮН_АТЫ.jpg" alt="Ozgor Kamp">
  </div>

</div>


<footer>

  <div>Ozgor Kamp</div>

  <a
    href="tel:+996500444459"
    class="phone"
  >
    0500 444 459
  </a>

</footer>

</body>
</html>
