<!DOCTYPE html>
<html lang="ky">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ozgor Kamp — Ата-энелер кабинети</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7f3;
      color: #142016;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: min(1050px, 92%);
      margin: auto;
    }

    header {
      background: white;
      border-bottom: 1px solid #e1e7e1;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav {
      min-height: 75px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 23px;
      font-weight: 900;
    }

    .logo small {
      display: block;
      font-size: 9px;
      letter-spacing: 3px;
      color: #788178;
      margin-top: 5px;
    }

    .logout {
      border: 1px solid #d7dfd7;
      background: white;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    main {
      padding: 55px 0 80px;
    }

    .welcome {
      background:
        radial-gradient(circle at 90% 20%, #cfe7d4, transparent 35%),
        linear-gradient(135deg, #ffffff, #edf5ee);

      border: 1px solid #dfe7df;
      border-radius: 28px;
      padding: 45px;
      margin-bottom: 40px;
    }

    .welcome span {
      color: #56805f;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    .welcome h1 {
      font-size: clamp(35px, 6vw, 58px);
      line-height: 1;
      letter-spacing: -2px;
      margin: 12px 0 15px;
    }

    .welcome p {
      color: #657068;
      max-width: 650px;
      font-size: 16px;
    }

    .section-title {
      font-size: 28px;
      margin-bottom: 20px;
    }

    .updates {
      display: grid;
      gap: 16px;
    }

    .update-card {
      background: white;
      border: 1px solid #dfe5df;
      border-radius: 20px;
      padding: 25px;
    }

    .update-date {
      font-size: 12px;
      color: #718075;
      margin-bottom: 8px;
    }

    .update-card h3 {
      font-size: 21px;
      margin-bottom: 10px;
    }

    .update-card p {
      color: #5f6c62;
      white-space: pre-line;
      line-height: 1.7;
    }

    .loading,
    .empty,
    .error {
      background: white;
      border: 1px solid #dfe5df;
      border-radius: 18px;
      padding: 25px;
      color: #68736a;
    }

    .error {
      color: #9a3030;
      background: #fff4f4;
      border-color: #edcccc;
    }

    @media(max-width: 560px) {
      .welcome {
        padding: 30px 22px;
      }

      main {
        padding-top: 30px;
      }

      .update-card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container nav">

    <a href="dashboard.html" class="logo">
      Ozgor Kamp
      <small>АТА-ЭНЕЛЕР КАБИНЕТИ</small>
    </a>

    <button class="logout" id="logoutButton">
      Чыгуу
    </button>

  </div>
</header>


<main>
  <div class="container">

    <div class="welcome">

      <span>ЖАБЫК БӨЛҮМ</span>

      <h1>
        Ата-энелер кабинети
      </h1>

      <p>
        Бул жерден Ozgor Kamp администрациясы жарыялаган
        күнүмдүк маалыматтарды көрө аласыз.
      </p>

    </div>


    <h2 class="section-title">
      Күнүмдүк маалыматтар
    </h2>


    <div id="updates">

      <div class="loading">
        Маалыматтар жүктөлүүдө...
      </div>

    </div>

  </div>
</main>


<script>
  const updatesContainer = document.getElementById("updates");
  const logoutButton = document.getElementById("logoutButton");


  function formatDate(dateString) {
    const date = new Date(dateString);

    return new Intl.DateTimeFormat("ky-KG", {
      day: "numeric",
      month: "long",
      year: "numeric",
      hour: "2-digit",
      minute: "2-digit"
    }).format(date);
  }


  async function loadUpdates() {

    try {

      const response = await fetch("/api/daily-updates", {
        method: "GET",
        credentials: "include"
      });


      if (response.status === 401) {
        window.location.href = "parents.html";
        return;
      }


      if (!response.ok) {
        throw new Error("Маалыматтарды алуу мүмкүн болгон жок");
      }


      const data = await response.json();


      if (!data.updates || data.updates.length === 0) {

        updatesContainer.innerHTML = `
          <div class="empty">
            Азырынча жаңы маалымат жок.
          </div>
        `;

        return;
      }


      updatesContainer.innerHTML = "";


      data.updates.forEach(function(update) {

        const card = document.createElement("div");

        card.className = "update-card";


        const date = document.createElement("div");

        date.className = "update-date";

        date.textContent = formatDate(update.created_at);


        const title = document.createElement("h3");

        title.textContent = update.title;


        const content = document.createElement("p");

        content.textContent = update.content;


        card.appendChild(date);
        card.appendChild(title);
        card.appendChild(content);


        updatesContainer.appendChild(card);

      });


    } catch (error) {

      console.error(error);

      updatesContainer.innerHTML = `
        <div class="error">
          Маалыматтарды жүктөөдө ката кетти.
        </div>
      `;

    }

  }


  logoutButton.addEventListener("click", async function() {

    try {

      await fetch("/api/logout", {
        method: "POST",
        credentials: "include"
      });

    } catch (error) {
      console.error(error);
    }


    sessionStorage.removeItem("ozgor_parent_access");

    window.location.href = "parents.html";

  });


  loadUpdates();
</script>

</body>
</html>
